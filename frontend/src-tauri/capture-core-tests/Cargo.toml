[package]
name = "stt-capture-core-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
dirs = "5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
log = "0.4"

[dev-dependencies]
once_cell = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
syn = { version = "3", features = ["full"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory"] }

[build-dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
